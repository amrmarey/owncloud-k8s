# StorageClass for KIND (Kubernetes IN Docker)
# KIND comes with Rancher's local-path-provisioner by default
# This storage class is specifically optimized for KIND clusters

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: owncloud-storage
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
