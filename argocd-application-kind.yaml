apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: owncloud
  namespace: argocd
  # Finalizer ensures proper cleanup
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Source repository
  source:
    repoURL: https://github.com/amrmarey/owncloud-k8s.git
    targetRevision: HEAD
    path: .
    
    # Directory configuration - Exclude all except KIND files
    directory:
      recurse: false
      # Exclude everything except KIND-specific files
      exclude: |
        owncloud.yaml
        storageclass.yaml
        owncloud-ingress.yaml
        argocd-application*.yaml
        *.md
        *.sh
        *.ps1
        .git/**
        mariadb.yaml.backup
  
  # Destination cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: owncloud-namespace
  
  # Sync policy
  syncPolicy:
    # Automated sync
    automated:
      prune: true        # Delete resources that are no longer in Git
      selfHeal: true     # Automatically sync when cluster state differs from Git
      allowEmpty: false  # Don't sync if source is empty
    
    # Sync options
    syncOptions:
      - CreateNamespace=true  # Auto-create namespace if it doesn't exist
      - PrunePropagationPolicy=foreground  # Wait for resources to be deleted
      - PruneLast=true  # Prune resources as the last step
    
    # Retry policy
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
