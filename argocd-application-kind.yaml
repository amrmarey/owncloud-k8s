apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: owncloud
  namespace: argocd
  # Finalizer ensures proper cleanup
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Source repository
  source:
    repoURL: https://github.com/amrmarey/owncloud-k8s.git
    targetRevision: HEAD
    path: .
    
    # Directory configuration - Include only KIND-compatible files
    directory:
      recurse: false
      # Explicitly include only the files needed for KIND deployment
      include: |
        owncloud-namespace.yaml
        storageclass-kind.yaml
        owncloud-secret.yaml
        configmap.yaml
        postgresql.yaml
        redis.yaml
        owncloud-kind.yaml
  
  # Destination cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: owncloud-namespace
  
  # Sync policy
  syncPolicy:
    # Automated sync
    automated:
      prune: true        # Delete resources that are no longer in Git
      selfHeal: true     # Automatically sync when cluster state differs from Git
      allowEmpty: false  # Don't sync if source is empty
    
    # Sync options
    syncOptions:
      - CreateNamespace=true  # Auto-create namespace if it doesn't exist
      - PrunePropagationPolicy=foreground  # Wait for resources to be deleted
      - PruneLast=true  # Prune resources as the last step
    
    # Retry policy
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
