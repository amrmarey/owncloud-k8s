apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files-pvc
  namespace: owncloud-namespace
spec:
  storageClassName: owncloud-storage
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: owncloud
  namespace: owncloud-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: owncloud
  template:
    metadata:
      labels:
        app: owncloud
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - owncloud
                topologyKey: kubernetes.io/hostname
      containers:
        - name: owncloud
          image: owncloud/server:10.16
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: owncloud-config
            - secretRef:
                name: owncloud-secrets
          volumeMounts:
            - name: files-storage
              mountPath: /mnt/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /status.php
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /status.php
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /status.php
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: files-storage
          persistentVolumeClaim:
            claimName: files-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: owncloud
  namespace: owncloud-namespace
spec:
  selector:
    app: owncloud
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: owncloud-pdb
  namespace: owncloud-namespace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: owncloud
